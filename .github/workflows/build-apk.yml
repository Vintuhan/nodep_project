name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.5 || true
          if [ ! -f gradlew ]; then
            # bootstrap wrapper without local gradle
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradlew -o gradlew
            mkdir -p gradle/wrapper
            curl -sL https://github.com/gradle/gradle/raw/v9.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nodep-apk
          path: app/build/outputs/apk/debug/app-debug.apk
