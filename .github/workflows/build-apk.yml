name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Этот экшен автоматически установит нужные платформы, считывая ваш build.gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Этот экшен автоматически кэширует зависимости и настраивает Gradle wrapper
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Сборка приложения с использованием Gradle Wrapper (рекомендуемый способ)
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nodep-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
